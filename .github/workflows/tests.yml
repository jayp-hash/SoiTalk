# Runs the automated checks (npm test) on every push and pull request.
# A red cross on GitHub means something broke; the report shows which screen and why.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04 # Playwright 1.56 cannot install its browser on ubuntu-latest (26.04)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-report
          path: playwright-report/
          retention-days: 14
